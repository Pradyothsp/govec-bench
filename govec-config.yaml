# govec config for govec-bench (mounted over the image's baked-in config.yaml).
# Mirrors the "Recommended govec config.yaml for Fair Benchmarking" in STATUS.md.

server:
  host: ""
  port: 8000
  shutdown_timeout: 10s
  log_level: "info"

storage:
  data_path: "./govec_data.bin"
  wal_path: "./govec.wal"
  auto_save_enabled: false # periodic saves hold the write lock for the whole snapshot -- pure noise for latency benchmarking
  auto_save_interval: 60s
  enable_mmap: false # keep both sides in-memory; mmap isn't a fair comparison unless Chroma is disk-backed the same way
  mmap_store_path: "./govec_mmap/"

engine:
  index_type: "hnsw" # ANN, to compare against Chroma's own HNSW index on equal footing
  quantization: "none"
  distance_metric: "cosine" # matches ChromaAdapter's collection (hnsw:space: "cosine")
  dimensions: 128 # SIFT10K/100K are 128-dim
  enable_hybrid_search: true
  enable_metadata_index: false
  hnsw_m: 16 # CANDIDATE under test: EfConstruction/EfSearch sweep found M=16/efc=200/efs=50 matches or beats M=24/efc=300/efs=20's recall at ~65% the edges (RAM) and ~half the insert cost -- see govec HNSW_NEIGHBOR_SELECTION.md sweep table; validating live before making this the new baseline
  hnsw_ef_search: 50 # raised from 20 -- buys back recall (98.0% recall@1 in pure-Go sweep); doesn't cost anything at k=50 since resultCap=max(k,efSearch) is already 50 there, only adds cost to low-k queries govec has slack on
  hnsw_ef_construction: 200 # lowered from 300 -- M=16 needs a narrower candidate pool than M=24 did to reach the same recall

grpc:
  enabled: false # not used by the benchmark adapters; disabled to keep the container's footprint minimal
  port: 50051
  max_recv_msg_size_mb: 64

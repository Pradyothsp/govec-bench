# Every database runs a pinned, published image, so anyone re-running this compares exactly the
# versions behind the published numbers. Bump a pin deliberately, and re-run everything after.
services:
  govec:
    image: ghcr.io/pradyothsp/govec:0.2.1
    container_name: govec-bench-govec
    ports:
      - "9697:9697"
    # GOMEMLIMIT cuts govec's measured RAM by about 46% at no latency cost, but 250MiB is tuned to
    # this benchmark's 100k-vector dataset and is no general default. Left off so every database
    # runs on stock settings; uncomment to reproduce that experiment.
    # environment:
    #   - GOMEMLIMIT=250MiB
    volumes:
      - ./govec-config.yaml:/app/config.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9697/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G

  govec-scalar:
    image: ghcr.io/pradyothsp/govec:0.2.1
    container_name: govec-bench-govec-scalar
    ports:
      - "9699:9697"
    volumes:
      - ./govec-config-scalar.yaml:/app/config.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9697/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G

  govec-mmap:
    image: ghcr.io/pradyothsp/govec:0.2.1
    container_name: govec-bench-govec-mmap
    ports:
      - "9700:9697"
    volumes:
      - ./govec-config-mmap.yaml:/app/config.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9697/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G

  chroma:
    # Chroma 1.4.4, pinned by digest: Chroma publishes no tag for this release.
    image: chromadb/chroma@sha256:1e0b73a187a28757c572acba508c46f48c9e8b0acaf5c20e6d95cdedce1acdf6
    container_name: govec-bench-chroma
    command: ["run", "/config.yaml"]
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/data
      - ./chroma-config.yaml:/config.yaml:ro
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G

  qdrant:
    image: qdrant/qdrant:v1.19.0
    container_name: govec-bench-qdrant
    ports:
      - "6333:6333" # REST, what the adapter uses
      - "6334:6334" # gRPC, unused by the adapter but exposed for parity/debugging
    volumes:
      - qdrant_data:/qdrant/storage
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G

volumes:
  chroma_data:
  qdrant_data:

services:
  govec:
    build:
      context: ../govec
      dockerfile: Dockerfile
    container_name: govec-bench-govec
    ports:
      - "8000:8000"
    # environment:
    #   - GOMEMLIMIT=250MiB # cuts measured RAM ~46% at no latency cost (see govec's docs/architecture/MEMORY_TUNING.md) -- left commented out on purpose: 250MiB was tuned to this benchmark's 100k-vector dataset specifically and isn't a safe default for other workload sizes, so the baseline here stays govec's true out-of-the-box behavior (matching Chroma's own line below, which is also just its stock defaults). Uncomment to reproduce that experiment.
    volumes:
      - ./govec-config.yaml:/app/config.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G

  chroma:
    image: chromadb/chroma:latest
    container_name: govec-bench-chroma
    command: ["run", "/config.yaml"]
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/data
      - ./chroma-config.yaml:/config.yaml:ro
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G

volumes:
  chroma_data:

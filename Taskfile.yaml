version: "3"

tasks:
  fmt:
    desc: Format code with ruff
    cmds:
      - uv run ruff check --fix .
      - uv run ruff format .

  fmt:check:
    desc: Check formatting and types (ruff + ty)
    aliases: [ check, fmt-check ]
    cmds:
      - uv run ruff check .
      - uv run ty check
      - uv run ruff format --check --diff .

  test:
    desc: Run tests
    cmd: uv run pytest

  data:download:
    desc: Download a dataset (DATASET=sift, the default, or dbpedia)
    aliases:
      - data-download
    cmd: uv run python -m scripts.download_datasets --dataset {{.DATASET | default "sift"}}

  data:export:
    desc: Write a dataset and its exact answers as fvecs/ivecs for govec's Go benchmarks (DATASET=dbpedia, the default, or sift; SIZE=small or large)
    aliases:
      - data-export
    cmd: uv run python -m scripts.export_dataset --dataset {{.DATASET | default "dbpedia"}} --size {{.SIZE | default "small"}}

  docker:up:
    desc: Start the comparison vector DBs (Chroma, ...) via Docker Compose
    aliases:
      - docker-up
    cmd: docker compose up -d

  docker:down:
    desc: Stop the comparison vector DBs
    aliases:
      - docker-down
    cmd: docker compose down

  docker:logs:
    desc: Tail logs from the comparison vector DBs
    aliases:
      - docker-logs
    cmd: docker compose logs -f

  docker:clean:
    desc: Remove this project's containers, images, and volumes to reclaim disk space
    aliases:
      - docker-clean
    cmd: ./scripts/docker_cleanup.sh

  bench:all:
    desc: Run all benchmarks (DATASET=sift, the default, or dbpedia); each starts its own containers
    aliases:
      - bench
    cmds:
      - task: bench:insert
      - task: bench:query
      - task: bench:recall
      - task: bench:memory
      - task: bench:coldstart

  bench:insert:
    desc: Insert latency benchmark
    aliases:
      - bench-insert
    cmd: uv run python -m govec_bench.benchmarks.insert --dataset {{.DATASET | default "sift"}} {{.CLI_ARGS}}

  bench:query:
    desc: Query latency benchmark
    aliases:
      - bench-query
    cmd: uv run python -m govec_bench.benchmarks.query --dataset {{.DATASET | default "sift"}} {{.CLI_ARGS}}

  bench:recall:
    desc: Recall@k benchmark
    aliases:
      - bench-recall
    cmd: uv run python -m govec_bench.benchmarks.recall --dataset {{.DATASET | default "sift"}} {{.CLI_ARGS}}

  bench:memory:
    desc: Memory usage benchmark
    aliases:
      - bench-memory
    cmd: uv run python -m govec_bench.benchmarks.memory --dataset {{.DATASET | default "sift"}} {{.CLI_ARGS}}

  bench:pipeline:
    desc: Every benchmark from one load per database (SIZE=small, the default, or large for 100k)
    aliases:
      - bench-pipeline
    cmd: uv run python -m govec_bench.benchmarks.pipeline --dataset {{.DATASET | default "sift"}} --size {{.SIZE | default "small"}} {{.CLI_ARGS}}

  bench:sweep:
    desc: Recall against latency across search ef for govec, chroma and qdrant (not part of bench:all)
    aliases:
      - bench-sweep
    cmd: uv run python -m govec_bench.benchmarks.ef_sweep --dataset {{.DATASET | default "sift"}} {{.CLI_ARGS}}

  bench:run:
    desc: Run an experiment's rounds (EXPERIMENT=a file in experiments/, or a path; -- --dry-run shows the plan)
    aliases:
      - bench-run
    cmd: uv run python -m govec_bench.cli run {{.EXPERIMENT}} {{.CLI_ARGS}}

  results:import:
    desc: Index results files into results/bench.db (default results/; pass folders after --, e.g. -- ../govec-notes/bench)
    aliases:
      - results-import
    cmd: uv run python -m govec_bench.cli import {{.CLI_ARGS}}

  results:runs:
    desc: List indexed runs, newest first (-- --benchmark pipeline --database govec-mmap to narrow)
    aliases:
      - results-runs
    cmd: uv run python -m govec_bench.cli runs {{.CLI_ARGS}}

  results:compare:
    desc: What an experiment session found, per metric (SESSION=an experiment, experiment/session or a folder; -- --baseline published)
    aliases:
      - results-compare
    cmd: uv run python -m govec_bench.cli compare {{.SESSION}} {{.CLI_ARGS}}

  bench:coldstart:
    desc: Cold start benchmark
    aliases:
      - bench-coldstart
    cmd: uv run python -m govec_bench.benchmarks.cold_start {{.CLI_ARGS}}

version: "3"

tasks:
  fmt:
    desc: Format code with ruff
    cmds:
      - uv run ruff check --fix .
      - uv run ruff format .

  fmt:check:
    desc: Check formatting and types (ruff + ty)
    aliases: [ check, fmt-check ]
    cmds:
      - uv run ruff check .
      - uv run ty check
      - uv run ruff format --check --diff .

  test:
    desc: Run tests
    cmd: uv run pytest

  data:download:
    desc: Download SIFT10K and SIFT100K datasets
    aliases:
      - data-download
    cmd: uv run python scripts/download_datasets.py

  docker:up:
    desc: Start the comparison vector DBs (Chroma, ...) via Docker Compose
    aliases:
      - docker-up
    cmd: docker compose up -d

  docker:down:
    desc: Stop the comparison vector DBs
    aliases:
      - docker-down
    cmd: docker compose down

  docker:logs:
    desc: Tail logs from the comparison vector DBs
    aliases:
      - docker-logs
    cmd: docker compose logs -f

  docker:clean:
    desc: Remove this project's containers, images, and volumes to reclaim disk space
    aliases:
      - docker-clean
    cmd: ./scripts/docker_cleanup.sh

  bench:all:
    desc: Run all benchmarks
    aliases:
      - bench
    cmds:
      - task: bench:insert
      - task: bench:query
      - task: bench:recall
      - task: bench:memory
      - task: bench:coldstart

  bench:insert:
    desc: Insert latency benchmark
    aliases:
      - bench-insert
    cmd: uv run python -m govec_bench.benchmarks.insert

  bench:query:
    desc: Query latency benchmark
    aliases:
      - bench-query
    cmd: uv run python -m govec_bench.benchmarks.query

  bench:recall:
    desc: Recall@k benchmark
    aliases:
      - bench-recall
    cmd: uv run python -m govec_bench.benchmarks.recall

  bench:memory:
    desc: Memory usage benchmark
    aliases:
      - bench-memory
    cmd: uv run python -m govec_bench.benchmarks.memory

  bench:coldstart:
    desc: Cold start benchmark
    aliases:
      - bench-coldstart
    cmd: uv run python -m govec_bench.benchmarks.cold_start

# govec config for the scalar-quantization variant (govec-scalar service).
# Identical to govec-config.yaml except engine.quantization -- isolates
# quantization as the only variable when comparing against the float32 govec run.

server:
  host: ""
  port: 9697
  shutdown_timeout: 10s
  log_level: "info"

storage:
  data_path: "./govec_data.bin"
  wal_path: "./govec.wal"
  auto_save_enabled: false # periodic saves hold the write lock for the whole snapshot -- pure noise for latency benchmarking
  auto_save_interval: 60s
  enable_mmap: false # keep both sides in-memory; mmap isn't a fair comparison unless Chroma is disk-backed the same way
  mmap_store_path: "./govec_mmap/"

engine:
  index_type: "hnsw" # ANN, to compare against Chroma's own HNSW index on equal footing
  quantization: "scalar" # int8 storage, ~4x memory reduction vs float32 -- see internal/core/quantize.go in govec
  distance_metric: "cosine" # matches ChromaAdapter's collection (hnsw:space: "cosine")
  dimensions: 0 # Learned from the first insert, as Chroma and Qdrant do, so one config serves every dataset
  enable_hybrid_search: true
  enable_metadata_index: false
  hnsw_m: 16 # matches Chroma's and Qdrant's defaults; earlier M=48 and M=24 tunings bought no recall for the extra memory
  hnsw_ef_search: 50 # raised from 20 -- buys back recall without costing anything at k=50, since resultCap=max(k,efSearch) is already 50 there regardless
  hnsw_ef_construction: 200 # govec's own factory default; M=16 needs a narrower candidate pool than M=24 did to reach the same recall

grpc:
  enabled: false # not used by the benchmark adapters; disabled to keep the container's footprint minimal
  port: 9698
  max_recv_msg_size_mb: 64
